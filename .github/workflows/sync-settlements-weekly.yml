name: Weekly driver-pay sync

on:
  schedule:
    # Mondays at 06:00 UTC. Adjust for your operating timezone — week
    # ends on Sunday by default, so Monday morning is right after the
    # week closes.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no posts)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Sync last week
        env:
          ACCOUNTING_API_KEY: ${{ secrets.ACCOUNTING_API_KEY }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          ACCOUNTING_BASE_URL: ${{ vars.ACCOUNTING_BASE_URL }}
        run: |
          accounting airtable sync-settlements-weekly \
            --base-url "$ACCOUNTING_BASE_URL" \
            ${{ inputs.dry_run && '--dry-run' || '--commit' }}
