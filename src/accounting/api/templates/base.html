<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Logistics Accounting{% endblock %}</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #f5f6f8;
      color: #1a1a1a;
    }
    header {
      background: #1f2937;
      color: white;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 18px; margin: 0; font-weight: 600; }
    header a { color: #cbd5e1; text-decoration: none; font-size: 14px; }
    header a:hover { color: white; }
    main { max-width: 1200px; margin: 24px auto; padding: 0 24px; }
    .grid { display: grid; gap: 16px; }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    @media (max-width: 800px) { .grid-3, .grid-2 { grid-template-columns: 1fr; } }
    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 16px 20px;
    }
    .card h2 { margin: 0 0 12px; font-size: 14px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    .metric { font-size: 28px; font-weight: 700; }
    .metric.neg { color: #b91c1c; }
    .sub { color: #6b7280; font-size: 13px; margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #f1f3f5; }
    th { font-size: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .neg { color: #b91c1c; }
    .pos { color: #047857; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .pill.warn { background: #fef3c7; color: #92400e; }
    .pill.ok { background: #d1fae5; color: #065f46; }
    .login-wrap { max-width: 360px; margin: 80px auto; padding: 24px; background: white; border: 1px solid #e5e7eb; border-radius: 8px; }
    .login-wrap input { width: 100%; padding: 10px; font-size: 14px; border: 1px solid #d1d5db; border-radius: 6px; }
    .login-wrap button { width: 100%; padding: 10px; margin-top: 12px; background: #1f2937; color: white; border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .err { color: #b91c1c; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
