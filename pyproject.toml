[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logistics-accounting"
version = "0.1.0"
description = "Double-entry accounting module tailored for a logistics business."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Logistics Engineering" }]
dependencies = [
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "click>=8.1",
    "fastapi>=0.111",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
accounting = "accounting.cli:cli"
accounting-api = "accounting.api.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"accounting.api" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
